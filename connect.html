<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AYAN | Contact</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="logo.css">
  <link rel="stylesheet" href="body.css">
  <link rel="stylesheet" href="menubtn.css">
  <link rel="stylesheet" href="scroll.css">
  <link rel="stylesheet" href="connect.css">
</head>
<body>

  <!-- Top Header Section -->
  <div class="header">
    <div class="logo-container">
        <span class="logo-text">AYAN</span>
    </div>
    <button class="open-btn" id="openBtn">☰</button>
  </div>

  <!-- Sliding Sidebar Drawer -->
  <div class="sidebar" id="sidebar">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="logo-container">
      <span class="logo-text">AYAN</span>
    </div>
    <ul class="sidebar-links">
      <li><a href="t.html">🏠 Home</a></li>
      <li><a href="profile.html">👤 About</a></li>
      <li><a href="explore.html">🔍 Explore</a></li>
      <li><a href="s.html">💻 Projects</a></li>
      <li><a href="connect.html" class="active">📞 Contact</a></li>
    </ul>
  </div>

  <!-- Dark Overlay -->
  <div class="overlay" id="overlay"></div>

  <!-- Main Viewport Wrap -->
  <div class="content">
    <div class="main-content">
      
      <!-- Contact Header Block -->
      <div class="contact-intro scroll-animate">
        <h1>Let's Connect 📬</h1>
        <p>Have a question, an app concept, or want to collaborate? Drop a message below!</p>
      </div>

      <!-- Glassmorphic Contact Form Box -->
      <div class="form-container scroll-animate">
        <form action="#" method="POST" id="contactForm">
          
          <div class="input-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
          </div>

          <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
          </div>

          <div class="input-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" placeholder="What is this about?" required>
          </div>

          <div class="input-group">
            <label for="message">Your Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Type your message here..." required></textarea>
          </div>

          <button  type="submit" class="submit-btn">Send Message 🚀</button>
        </form>
      </div>

    </div>
  </div>

  <!-- Sticky Bottom Navigation Footer -->
  <footer>
     <nav class="bottom-nav">
      <a href="t.html" class="nav-item">
        <span class="nav-icon">🏠</span>Home
      </a>
      <a href="explore.html" class="nav-item">
        <span class="nav-icon">🔍</span>Explore
      </a>
      <a href="profile.html" class="nav-item">
        <span class="nav-icon">👤</span>Profile
      </a>
      <a href="connect.html" class="nav-item active">
        <span class="nav-icon">📞</span>Contact
      </a>
      <a href="setting.html" class="nav-item">
        <span class="nav-icon">⚙️</span>Setting
      </a>
    </nav>
  </footer>

  <!-- Scripts Logic Linkages -->
  <script src="script.js"></script>
  <script src="scroll.js"></script>

</body>
</html>
